<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="720" viewBox="0 0 1460 720" role="img" aria-labelledby="title desc">
  <title id="title">LoRaLarm data flow</title>
  <desc id="desc">Signal path from LoRa devices through a gateway to ChirpStack. ChirpStack writes decoded fields and metadata to InfluxDB, which Grafana dashboards query, and publishes every uplink via the Mosquitto MQTT broker. The loralarm Python service subscribes to that feed, evaluates alarm rules, logs events to SQLite, sends downlinks back and pushes notifications (ntfy, Pushover) to phones; its devices, families, alarm thresholds and notification routing come from a hand-edited devices.json configuration file. Grafana can also send its own alerts to phones. Node-RED consumes the same feed as the legacy parallel path. An admin console configures the gateway, ChirpStack and InfluxDB.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAdmin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arrowLegacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .core { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2.5; rx: 12; }
      .legacy { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 5; rx: 12; }
      .admin { fill: #fefce8; stroke: #b45309; stroke-width: 2; rx: 12; }
      .icon { fill: #0f766e; }
      .name { font: bold 20px sans-serif; fill: #0f172a; }
      .sub  { font: 14px sans-serif; fill: #475569; }
      .link { font: 13px sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect x="0" y="0" width="1460" height="720" fill="#ffffff"/>

  <!-- Admin -->
  <g>
    <rect x="590" y="20" width="170" height="100" rx="12" class="admin"/>
    <circle cx="675" cy="48" r="11" fill="none" stroke="#b45309" stroke-width="4"/>
    <path d="M 675 33 v -6 M 675 69 v -6 M 660 48 h -6 M 696 48 h -6 M 664 37 l -4 -4 M 690 63 l 4 4 M 664 59 l -4 4 M 690 33 l 4 4" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <text x="675" y="88" class="name" text-anchor="middle">Admin</text>
    <text x="675" y="106" class="sub" text-anchor="middle">Setup &amp; monitoring</text>
  </g>

  <!-- Admin connections (dashed) -->
  <g stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowAdmin)">
    <line x1="620" y1="120" x2="405" y2="146"/>
    <line x1="675" y1="120" x2="675" y2="146"/>
    <line x1="730" y1="120" x2="1180" y2="146"/>
  </g>

  <!-- Devices -->
  <g>
    <rect x="30" y="150" width="170" height="120" rx="12" class="box"/>
    <rect x="85" y="170" width="60" height="38" rx="6" class="icon"/>
    <path d="M 100 208 v 20 M 130 208 v 20 M 88 212 h 54 M 115 160 v 10 M 108 170 h 14" stroke="#0f766e" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="115" y="242" class="name" text-anchor="middle">Devices</text>
    <text x="115" y="260" class="sub" text-anchor="middle">LoRa sensors</text>
  </g>

  <!-- Gateway -->
  <g>
    <rect x="310" y="150" width="170" height="120" rx="12" class="box"/>
    <path d="M 375 175 l -25 40 h 50 z" class="icon"/>
    <rect x="373" y="215" width="4" height="10" fill="#94a3b8"/>
    <path d="M 375 225 v 8" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 360 185 a 20 20 0 0 1 30 0 M 352 177 a 30 30 0 0 1 46 0" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="395" y="242" class="name" text-anchor="middle">Gateway</text>
    <text x="395" y="260" class="sub" text-anchor="middle">LoRaWAN base station</text>
  </g>

  <!-- ChirpStack -->
  <g>
    <rect x="590" y="150" width="170" height="120" rx="12" class="box"/>
    <circle cx="675" cy="182" r="16" class="icon"/>
    <path d="M 665 182 l 7 8 l 14 -16" stroke="#f8fafc" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="675" y="242" class="name" text-anchor="middle">ChirpStack</text>
    <text x="675" y="260" class="sub" text-anchor="middle">Network server</text>
  </g>

  <!-- InfluxDB -->
  <g>
    <rect x="1150" y="150" width="170" height="120" rx="12" class="box"/>
    <path d="M 1215 186 v 24 a 20 8 0 0 0 40 0 v -24" class="icon"/>
    <ellipse cx="1235" cy="186" rx="20" ry="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
    <text x="1235" y="242" class="name" text-anchor="middle">InfluxDB</text>
    <text x="1235" y="260" class="sub" text-anchor="middle">Time series</text>
  </g>

  <!-- Devices.json configuration -->
  <g>
    <rect x="870" y="300" width="170" height="100" rx="12" class="admin"/>
    <circle cx="955" cy="328" r="11" fill="none" stroke="#b45309" stroke-width="4"/>
    <path d="M 955 313 v -6 M 955 349 v -6 M 940 328 h -6 M 976 328 h -6 M 944 317 l -4 -4 M 970 343 l 4 4 M 944 339 l -4 4 M 970 313 l 4 4" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <text x="955" y="368" class="name" text-anchor="middle">Config</text>
    <text x="955" y="386" class="sub" text-anchor="middle">devices.json</text>
  </g>

  <!-- Config connection (dashed) -->
  <g stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowAdmin)">
    <line x1="955" y1="400" x2="955" y2="424"/>
  </g>

  <!-- Mosquitto (MQTT broker) -->
  <g>
    <rect x="590" y="430" width="170" height="110" rx="12" class="box"/>
    <rect x="645" y="448" width="60" height="22" rx="6" class="icon"/>
    <rect x="645" y="474" width="60" height="22" rx="6" class="icon"/>
    <circle cx="655" cy="459" r="3" fill="#f8fafc"/>
    <circle cx="655" cy="485" r="3" fill="#f8fafc"/>
    <text x="675" y="512" class="name" text-anchor="middle">Mosquitto</text>
    <text x="675" y="530" class="sub" text-anchor="middle">MQTT broker</text>
  </g>

  <!-- Node-RED (legacy) -->
  <g>
    <rect x="310" y="430" width="170" height="110" rx="12" class="legacy"/>
    <rect x="365" y="448" width="60" height="34" rx="6" class="icon"/>
    <path d="M 372 465 l 6 0 l 5 -12 l 6 24 l 6 -12 h 20" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="395" y="512" class="name" text-anchor="middle">Node-RED</text>
    <text x="395" y="530" class="sub" text-anchor="middle">Legacy flows</text>
  </g>

  <!-- loralarm Python service -->
  <g>
    <rect x="870" y="430" width="170" height="110" rx="12" class="core"/>
    <path d="M 919 458 h 8 M 919 469 h 8 M 919 480 h 8 M 983 458 h 8 M 983 469 h 8 M 983 480 h 8" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
    <rect x="927" y="448" width="56" height="40" rx="6" class="icon"/>
    <path d="M 959 455 L 948 471 L 955 471 L 950 483 L 963 466 L 956 466 Z" fill="#f8fafc"/>
    <text x="955" y="512" class="name" text-anchor="middle">loralarm</text>
    <text x="955" y="530" class="sub" text-anchor="middle">Python alarm engine</text>
  </g>

  <!-- Phone -->
  <g>
    <rect x="1150" y="580" width="170" height="110" rx="12" class="box"/>
    <rect x="1218" y="596" width="36" height="56" rx="8" fill="none" stroke="#0f766e" stroke-width="3"/>
    <rect x="1226" y="604" width="20" height="24" rx="3" class="icon"/>
    <rect x="1226" y="634" width="20" height="6" rx="2" fill="#94a3b8"/>
    <text x="1235" y="662" class="name" text-anchor="middle">Phone</text>
    <text x="1235" y="680" class="sub" text-anchor="middle">ntfy · Pushover</text>
  </g>

  <!-- SQLite -->
  <g>
    <rect x="870" y="580" width="170" height="110" rx="12" class="box"/>
    <path d="M 935 604 v 26 a 20 8 0 0 0 40 0 v -26" class="icon"/>
    <ellipse cx="955" cy="604" rx="20" ry="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
    <text x="955" y="662" class="name" text-anchor="middle">SQLite</text>
    <text x="955" y="680" class="sub" text-anchor="middle">Event log · state</text>
  </g>

  <!-- Grafana -->
  <g>
    <rect x="1150" y="430" width="170" height="110" rx="12" class="box"/>
    <path d="M 1220 458 v 34 h 36" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 1224 486 l 8 -12 l 8 6 l 10 -16" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1235" y="512" class="name" text-anchor="middle">Grafana</text>
    <text x="1235" y="530" class="sub" text-anchor="middle">Dashboards</text>
  </g>

  <!-- Arrows: ingest path -->
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="204" y1="210" x2="300" y2="210"/>
    <line x1="484" y1="210" x2="580" y2="210"/>
    <line x1="764" y1="210" x2="1140" y2="210"/>
    <line x1="675" y1="270" x2="675" y2="424"/>
    <line x1="764" y1="485" x2="864" y2="485"/>
    <line x1="1020" y1="540" x2="1178" y2="572"/>
    <line x1="955" y1="540" x2="955" y2="574"/>
    <line x1="1235" y1="270" x2="1235" y2="424"/>
    <line x1="1235" y1="540" x2="1235" y2="574"/>
  </g>

  <!-- Arrows: legacy and downlink (dashed) -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arrowLegacy)">
    <line x1="590" y1="485" x2="486" y2="485"/>
    <line x1="870" y1="505" x2="766" y2="505"/>
  </g>

  <!-- Link labels -->
  <g class="link" text-anchor="middle">
    <text x="255" y="190">LoRa 868 MHz</text>
    <text x="535" y="190">IP / Internet</text>
    <text x="950" y="190">Decoded fields + metadata</text>
    <text x="815" y="472">Subscribe</text>
    <text x="1050" y="548">Push</text>
    <text x="538" y="472">Legacy</text>
  </g>
  <g class="link" text-anchor="start">
    <text x="690" y="350">Every uplink on MQTT</text>
    <text x="968" y="560">Events</text>
    <text x="1250" y="350">Flux queries</text>
    <text x="1248" y="562">Alerts</text>
  </g>
  <g class="link" text-anchor="middle">
    <text x="818" y="524">Downlinks</text>
  </g>
</svg>
