<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="330" viewBox="0 0 1360 330" role="img" aria-labelledby="title desc">
  <title id="title">LoRaLarm data flow</title>
  <desc id="desc">Signal path from LoRa devices through a gateway and ChirpStack to Node-RED, which sends notifications to phones and updates the web dashboard. An admin console configures and monitors the gateway, ChirpStack, and Node-RED.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAdmin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .admin { fill: #fefce8; stroke: #b45309; stroke-width: 2; rx: 12; }
      .icon { fill: #0f766e; }
      .name { font: bold 20px sans-serif; fill: #0f172a; }
      .sub  { font: 14px sans-serif; fill: #475569; }
      .link { font: 13px sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect x="0" y="0" width="1360" height="330" fill="#ffffff"/>

  <!-- Admin -->
  <g>
    <rect x="590" y="20" width="170" height="100" rx="12" class="admin"/>
    <circle cx="675" cy="48" r="11" fill="none" stroke="#b45309" stroke-width="4"/>
    <path d="M 675 33 v -6 M 675 69 v -6 M 660 48 h -6 M 696 48 h -6 M 664 37 l -4 -4 M 690 63 l 4 4 M 664 59 l -4 4 M 690 33 l 4 -4" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <text x="675" y="88" class="name" text-anchor="middle">Admin</text>
    <text x="675" y="106" class="sub" text-anchor="middle">Setup &amp; monitoring</text>
  </g>

  <!-- Admin connections (dashed) -->
  <g stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowAdmin)">
    <line x1="620" y1="120" x2="405" y2="146"/>
    <line x1="675" y1="120" x2="675" y2="146"/>
    <line x1="730" y1="120" x2="945" y2="146"/>
  </g>

  <!-- Devices -->
  <g>
    <rect x="30" y="150" width="170" height="120" rx="12" class="box"/>
    <rect x="85" y="170" width="60" height="38" rx="6" class="icon"/>
    <path d="M 100 208 v 20 M 130 208 v 20 M 88 212 h 54 M 115 160 v 10 M 108 170 h 14" stroke="#0f766e" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="115" y="242" class="name" text-anchor="middle">Devices</text>
    <text x="115" y="260" class="sub" text-anchor="middle">LoRa sensors</text>
  </g>

  <!-- Gateway -->
  <g>
    <rect x="310" y="150" width="170" height="120" rx="12" class="box"/>
    <path d="M 375 175 l -25 40 h 50 z" class="icon"/>
    <rect x="373" y="215" width="4" height="10" fill="#94a3b8"/>
    <path d="M 375 225 v 8" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 360 185 a 20 20 0 0 1 30 0 M 352 177 a 30 30 0 0 1 46 0" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="395" y="242" class="name" text-anchor="middle">Gateway</text>
    <text x="395" y="260" class="sub" text-anchor="middle">LoRaWAN base station</text>
  </g>

  <!-- ChirpStack -->
  <g>
    <rect x="590" y="150" width="170" height="120" rx="12" class="box"/>
    <circle cx="675" cy="182" r="16" class="icon"/>
    <path d="M 665 182 l 7 8 l 14 -16" stroke="#f8fafc" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="675" y="242" class="name" text-anchor="middle">ChirpStack</text>
    <text x="675" y="260" class="sub" text-anchor="middle">LoRaWAN network server</text>
  </g>

  <!-- Node-RED -->
  <g>
    <rect x="870" y="150" width="170" height="120" rx="12" class="box"/>
    <rect x="925" y="170" width="60" height="34" rx="6" class="icon"/>
    <path d="M 932 187 l 6 0 l 5 -12 l 6 24 l 6 -12 h 20" stroke="#f8fafc" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="955" y="242" class="name" text-anchor="middle">Node-RED</text>
    <text x="955" y="260" class="sub" text-anchor="middle">Flow automation</text>
  </g>

  <!-- Phone / Web -->
  <g>
    <rect x="1150" y="150" width="170" height="120" rx="12" class="box"/>
    <rect x="1182" y="168" width="34" height="60" rx="8" fill="none" stroke="#0f766e" stroke-width="3"/>
    <rect x="1190" y="178" width="18" height="22" rx="3" class="icon"/>
    <rect x="1190" y="204" width="18" height="6" rx="2" fill="#94a3b8"/>
    <circle cx="1232" cy="188" r="16" fill="none" stroke="#0f766e" stroke-width="3"/>
    <path d="M 1224 184 h 16 M 1224 190 h 16 M 1224 196 h 10" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
    <text x="1235" y="242" class="name" text-anchor="middle">Phone / Web</text>
    <text x="1235" y="260" class="sub" text-anchor="middle">Notifications</text>
  </g>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="204" y1="210" x2="300" y2="210"/>
    <line x1="484" y1="210" x2="580" y2="210"/>
    <line x1="764" y1="210" x2="860" y2="210"/>
    <line x1="1044" y1="210" x2="1140" y2="210"/>
  </g>
  <g class="link" text-anchor="middle">
    <text x="255" y="190">LoRa 868 MHz</text>
    <text x="535" y="190">IP / Internet</text>
    <text x="815" y="190">MQTT / HTTP</text>
    <text x="1095" y="190">Push / HTTPS</text>
  </g>
</svg>
