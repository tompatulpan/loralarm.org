<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <meta name="theme-color" content="#0b0f14">
  {{ range .Translations }}
  <link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .RelPermalink | absURL }}">
  {{ end }}
  <link rel="alternate" hreflang="x-default" href="{{ .RelPermalink | absURL }}">
  {{ range slice "css/variables.css" "css/base.css" "css/layout.css" "css/components.css" }}
  <link rel="stylesheet" href="{{ . | relURL }}">
  {{ end }}
  <script src="{{ "js/lightbox.js" | relURL }}" defer></script>
  <script src="{{ "js/hero-fade.js" | relURL }}" defer></script>
  <script src="{{ "js/lang-detect.js" | relURL }}" defer></script>
</head>
<body{{ if .IsHome }} class="is-home"{{ end }}>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
